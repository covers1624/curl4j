name: Build Natives

on:
  workflow_call:
    outputs:
      workflow_id:
        description: "The ID of the workflow run."
        value: "${{ github.run_id }}"

jobs:
  build_linux_x64-gnu:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cd native_build
          PLATFORM=linux_x64 LIBC=gnu make
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux_x64-gnu
          path: |
            native_build/install/libcurl*

  test_linux_x64-gnu:
    runs-on: ubuntu-22.04
    needs: build_linux_x64-gnu
    steps:
      - uses: actions/checkout@v4
      - name: Gradle Cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-
      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
      - uses: actions/download-artifact@v4
        with:
          name: linux_x64-gnu
          path: native_build/install/
      - name: "Check"
        run: |
          ./gradlew check -si

  build_linux_x64-musl:
    runs-on: ubuntu-22.04
    container:
      image: alpine:3.21.0
    steps:
      - name: "Setup"
        run: |
          apk update
          apk add git curl runuser build-base cmake samurai perl linux-headers pkgconf
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cd native_build
          PLATFORM=linux_x64 LIBC=musl make
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux_x64-musl
          path: |
            native_build/install/libcurl*

  test_linux_x64-musl:
    runs-on: ubuntu-22.04
    needs: build_linux_x64-musl
    container:
      image: alpine:3.21.0
    steps:
      - name: "Setup"
        run: |
          wget -O /etc/apk/keys/adoptium.rsa.pub https://packages.adoptium.net/artifactory/api/security/keypair/public/repositories/apk
          echo 'https://packages.adoptium.net/artifactory/apk/alpine/main' >> /etc/apk/repositories
          apk update
          apk add git temurin-25-jdk
      - uses: actions/checkout@v4
      - name: Gradle Cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-
      - uses: actions/download-artifact@v4
        with:
          name: linux_x64-musl
          path: native_build/install/
      - name: "Check"
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-25-temurin/
          export LIBC=musl
          ./gradlew check -si -Porg.gradle.native=false

  build_linux_arm64-gnu:
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cd native_build
          PLATFORM=linux_arm64 LIBC=gnu make
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux_arm64-gnu
          path: |
            native_build/install/libcurl*

  test_linux_arm64-gnu:
    runs-on: ubuntu-22.04-arm
    needs: build_linux_arm64-gnu
    steps:
      - uses: actions/checkout@v4
      - name: Gradle Cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-
      - uses: actions/download-artifact@v4
        with:
          name: linux_arm64-gnu
          path: native_build/install/
      - name: "Check"
        run: |
          ./gradlew check -si

  build_linux_arm64-musl:
    runs-on: ubuntu-22.04-arm
    container:
      image: alpine:3.21.0
      # Mount rw fs over readonly container mount folder.
      volumes:
        - /tmp/node20:/__e/node20
    steps:
      - name: "Setup"
        run: |
          apk update
          apk add git curl
          apk add runuser build-base cmake samurai perl linux-headers pkgconf
          
          # JavaScript actions on arm64 alpine are currently unsupported by GitHub.
          # However, we can trivially add it by installing node ourselves, and faking not being alpine.
          apk add nodejs
          mkdir -p /__e/node20/bin/
          ln -s /usr/bin/node /__e/node20/bin/
          ln -s /usr/bin/npm /__e/node20/bin/
          sed -i 's/ID=alpine/ID=unknown/' /usr/lib/os-release
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cd native_build
          PLATFORM=linux_arm64 LIBC=musl make
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux_arm64-musl
          path: |
            native_build/install/libcurl*

  test_linux_arm64-musl:
    runs-on: ubuntu-22.04-arm
    needs: build_linux_arm64-musl
    container:
      image: alpine:3.21.0
      # Mount rw fs over readonly container mount folder.
      volumes:
        - /tmp/node20:/__e/node20
    steps:
      - name: "Setup"
        run: |
          wget -O /etc/apk/keys/adoptium.rsa.pub https://packages.adoptium.net/artifactory/api/security/keypair/public/repositories/apk
          echo 'https://packages.adoptium.net/artifactory/apk/alpine/main' >> /etc/apk/repositories
          apk update
          apk add git temurin-25-jdk
          
          # JavaScript actions on arm64 alpine are currently unsupported by GitHub.
          # However, we can trivially add it by installing node ourselves, and faking not being alpine.
          apk add nodejs
          mkdir -p /__e/node20/bin/
          ln -s /usr/bin/node /__e/node20/bin/
          ln -s /usr/bin/npm /__e/node20/bin/
          sed -i 's/ID=alpine/ID=unknown/' /usr/lib/os-release
      - uses: actions/checkout@v4
      - name: Gradle Cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-
      - uses: actions/download-artifact@v4
        with:
          name: linux_arm64-musl
          path: native_build/install/
      - name: "Check"
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-25-temurin/
          export LIBC=musl
          ./gradlew check -si -Porg.gradle.native=false

  build_windows_x64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies.
        run: |
          sudo apt update
          sudo apt install mingw-w64
      - name: Build
        run: |
          cd native_build
          PLATFORM=windows_x64 make
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows_x64
          path: |
            native_build/install/libcurl*

  test_windows_x64:
    runs-on: windows-2022
    needs: build_windows_x64
    steps:
      - uses: actions/checkout@v4
      - name: Gradle Cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-
      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
      - uses: actions/download-artifact@v4
        with:
          name: windows_x64
          path: native_build/install/
      - name: "Check"
        run: |
          ./gradlew check -si

  build_macos_x64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies.
        run: |
          rm -rf /usr/local/Cellar/openssl*/**/include
          brew install make coreutils automake
      - name: Build
        run: |
          cd native_build
          PLATFORM=macos_x64 gmake
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos_x64
          path: |
            native_build/install/libcurl*

  test_macos_x64:
    runs-on: macos-15
    needs: build_macos_x64
    steps:
      - uses: actions/checkout@v4
      - name: Gradle Cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-
      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          architecture: 'x64'
      - uses: actions/download-artifact@v4
        with:
          name: macos_x64
          path: native_build/install/
      - name: "Check"
        run: |
          ./gradlew check -si

  build_macos_arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies.
        run: |
          rm -rf /usr/local/Cellar/openssl*/**/include
          brew install make coreutils automake
      - name: Build
        run: |
          cd native_build
          PLATFORM=macos_arm64 gmake
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos_arm64
          path: |
            native_build/install/libcurl*

  test_macos_arm64:
    runs-on: macos-15
    needs: build_macos_arm64
    steps:
      - uses: actions/checkout@v4
      - name: Gradle Cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-
      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          architecture: 'aarch64'
      - uses: actions/download-artifact@v4
        with:
          name: macos_arm64
          path: native_build/install/
      - name: "Check"
        run: |
          ./gradlew check -si

  collate:
    runs-on: ubuntu-22.04
    needs: [
      build_linux_x64-gnu, test_linux_x64-gnu,
      build_linux_x64-musl, test_linux_x64-musl,
      build_linux_arm64-gnu, test_linux_arm64-gnu,
      build_linux_arm64-musl, test_linux_arm64-musl,
      build_windows_x64, test_windows_x64,
      build_macos_x64, test_macos_x64,
      build_macos_arm64, test_macos_arm64
    ]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux_x64-gnu
          path: native_build/install/
      - uses: actions/download-artifact@v4
        with:
          name: linux_x64-musl
          path: native_build/install/
      - uses: actions/download-artifact@v4
        with:
          name: linux_arm64-gnu
          path: native_build/install/
      - uses: actions/download-artifact@v4
        with:
          name: linux_arm64-musl
          path: native_build/install/
      - uses: actions/download-artifact@v4
        with:
          name: windows_x64
          path: native_build/install/
      - uses: actions/download-artifact@v4
        with:
          name: macos_x64
          path: native_build/install/
      - uses: actions/download-artifact@v4
        with:
          name: macos_arm64
          path: native_build/install/
      - name: Upload All Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: natives
          path: |
            native_build/install/libcurl*
